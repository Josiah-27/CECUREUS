# CECUREUS Server — Nginx Reverse Proxy Configuration
#
# USAGE:
# 1. Copy to /etc/nginx/sites-available/cecureus
# 2. Create symlink: ln -s /etc/nginx/sites-available/cecureus /etc/nginx/sites-enabled/
# 3. Update server_name to your domain
# 4. Update SSL certificate paths
# 5. Test: nginx -t
# 6. Reload: systemctl reload nginx
#

# Rate limiting zone (shared memory)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

# Upstream — multiple Node.js instances for load balancing
upstream cecureus_backend {
    least_conn;
    server 127.0.0.1:3000;
    # Add more instances for horizontal scaling:
    # server 127.0.0.1:3001;
    # server 127.0.0.1:3002;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.cecureus.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.cecureus.com;

    # ─── SSL CONFIGURATION ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.cecureus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cecureus.com/privkey.pem;

    # TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── SECURITY HEADERS ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── REQUEST SIZE LIMITS ────────────────────────────────
    client_max_body_size 5m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ─── LOGGING ────────────────────────────────────────────
    access_log /var/log/nginx/cecureus_access.log;
    error_log  /var/log/nginx/cecureus_error.log;

    # ─── HEALTH CHECK (no rate limit) ──────────────────────
    location = /health {
        proxy_pass http://cecureus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /ready {
        proxy_pass http://cecureus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ─── AUTH ENDPOINTS (strict rate limit) ─────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://cecureus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── ALL OTHER API ENDPOINTS ────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://cecureus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny all other paths
    location / {
        return 404;
    }
}
